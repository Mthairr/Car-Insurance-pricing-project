name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests et qualité du code
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Installation des dépendances
        run: pip install -r api/requirements.txt ruff

      - name: Vérification de la qualité du code (ruff)
        run: ruff check api/

      - name: Exécution des tests (pytest)
        run: pytest api/tests -v

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t prime-api .
